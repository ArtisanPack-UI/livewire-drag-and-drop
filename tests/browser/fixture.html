<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Keyboard fixture</title>
    <style>
        .board { display: flex; gap: 1rem; }
        [x-drag-context] { min-height: 4rem; min-width: 10rem; padding: .5rem; border: 1px solid #999; }
        [x-drag-item] { padding: .5rem; margin: .25rem 0; background: #eee; }
    </style>
</head>
<body>
<main x-data="{ log: [] }">
    <div class="board">
        <div x-drag-context data-drag-group="cards" data-drag-context-id="packing" data-drag-label="Packing" id="packing"
             @drag:end="log.push($event.detail)">
            <div x-drag-item="'1042'" data-drag-label="Order 1042">Order 1042</div>
            <div x-drag-item="'1043'" data-drag-label="Order 1043">Order 1043</div>
        </div>
        <div x-drag-context data-drag-group="cards" data-drag-context-id="qc" data-drag-label="QC" id="qc"
             @drag:end="log.push($event.detail)"></div>
        <div x-drag-context data-drag-group="cards" data-drag-context-id="shipped" data-drag-label="Shipped" id="shipped"
             @drag:end="log.push($event.detail)">
            <div x-drag-item="'1001'" data-drag-label="Order 1001">Order 1001</div>
        </div>
    </div>
    <button id="after">After</button>
    <output id="log" x-text="JSON.stringify(log)"></output>
</main>
<script type="module">
    import Alpine from '/node_modules/alpinejs/dist/module.esm.js';
    import '/src/index.js';
    window.Alpine = Alpine;
    Alpine.start();
    window.__ready = true;
</script>
</body>
</html>
